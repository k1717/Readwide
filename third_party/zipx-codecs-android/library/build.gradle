plugins {
    id 'com.android.library'
}

def readwideExternalBuildDir = System.getenv('READWIDE_APP_BUILD_DIR')
def nativeStagingDir = readwideExternalBuildDir == null || readwideExternalBuildDir.trim().isEmpty()
        ? layout.buildDirectory.dir('.cxx').get().asFile
        : file("${readwideExternalBuildDir}/native-staging/zipxCodecsAndroid")

android {
    namespace 'com.readwide.codecs'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
            buildStagingDirectory nativeStagingDir
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
