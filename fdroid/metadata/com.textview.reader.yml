Summary: Local-first reader and file browser
Description: |-
  Readwide is a local-first Android reader and file browser for TXT, PDF,
  EPUB, Word documents, images, comic archives, and archive workflows.

  The default build does not request INTERNET permission and does not include
  ads, analytics, account login, Firebase, Google Play Services, or Junrar /
  UnRAR-license fallback code. Android Auto Backup is disabled.

  Readwide is designed for local files and therefore requests broad file access
  on modern Android versions. This is used for user-selected reading, browsing,
  copy, move, delete, archive extraction, and archive creation workflows.

  The Android applicationId remains com.textview.reader for update
  compatibility with the previous TextView Reader 2.2.6 line when signed with
  the same key.
