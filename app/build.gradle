plugins {
    id 'com.android.application'
}

// Public release builds read signing secrets from environment variables first,
// then from ~/.gradle/gradle.properties. Do not commit keystores or passwords.

// RAR3/RAR4 compressed extraction uses the bundled libarchive-android backend in the normal FOSS APK.

// Read a release-signing secret by suffix: READWIDE_<SUFFIX> first, then the
// legacy TEXTVIEW_<SUFFIX> name for backward compatibility, checking environment
// variables before ~/.gradle/gradle.properties.
def releaseSecret = { String suffix, String fallback = "" ->
    for (String name : ["READWIDE_" + suffix, "TEXTVIEW_" + suffix]) {
        String envValue = System.getenv(name)
        if (envValue != null && !envValue.isEmpty()) return envValue
        def propValue = project.findProperty(name)
        if (propValue != null && !propValue.toString().isEmpty()) return propValue.toString()
    }
    return fallback
}

def hasReleaseSigning =
        releaseSecret("KEYSTORE_PATH", "") != "" &&
        releaseSecret("KEYSTORE_PASSWORD", "") != "" &&
        releaseSecret("KEY_ALIAS", "") != "" &&
        releaseSecret("KEY_PASSWORD", "") != ""

android {
    namespace 'com.readwide.manager'
    compileSdk 35
    // Keep the app-level symbol-strip task on the same installed NDK as both
    // source-built native library modules.
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId "com.readwide.manager"
        minSdk 24
        targetSdk 35
        versionCode 10017
        versionName "1.0.17"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Release APKs keep Android ARM ABIs only.
        // This removes x86/x86_64 native payloads from libarchive-android while
        // preserving armeabi-v7a and arm64-v8a device support.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSecret("KEYSTORE_PATH"))
                storePassword releaseSecret("KEYSTORE_PASSWORD")
                keyAlias releaseSecret("KEY_ALIAS")
                keyPassword releaseSecret("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            zipAlignEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        diagnostic {
            initWith release
            matchingFallbacks = ['release']
            minifyEnabled false
            shrinkResources false
            debuggable true
            jniDebuggable false
            zipAlignEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/INDEX.LIST'
            ]
        }
    }

}

// Safety cleanup for ZIP-over-existing-folder updates.
// Junrar was removed in 2.2.6, but overlay extraction does not delete files that
// existed in an older working tree. A stale RarJunrarFallback.java would still be
// compiled and fail because the Junrar dependency is intentionally gone.
def textviewRemovedLegacySourceFiles = [
        'src/main/java/com/readwide/manager/archive/RarJunrarFallback.java',
        // Moved to app/src/test in the 1.0.6 line (diagnostic/test-only probe).
        'src/main/java/com/readwide/manager/archive/Rar3PpmdEngineFixtureProbe.java'
]

tasks.register('deleteRemovedLegacySourceFiles') {
    group = 'cleanup'
    description = 'Deletes source files removed from older Readwide builds but possibly left behind by overlay extraction.'
    doLast {
        textviewRemovedLegacySourceFiles.each { relPath ->
            def stale = file(relPath)
            if (stale.exists()) {
                if (!stale.delete()) {
                    throw new GradleException("Could not delete stale removed source file: ${stale}")
                }
                println "Deleted stale removed source file: ${stale}"
            }
        }
    }
}

tasks.matching { task ->
    task.name == 'preBuild' || (task.name.startsWith('compile') && task.name.endsWith('JavaWithJavac'))
}.configureEach {
    dependsOn(tasks.named('deleteRemovedLegacySourceFiles'))
}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.albfernandez:juniversalchardet:2.5.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    // Android libarchive 3.8.9 backend, built from the pinned vendored sources.
    implementation project(':libarchiveAndroid')
    // Isolated LGPL-2.1-or-later native module for WinZip JPEG plus BSD-3-Clause
    // WavPack. The app calls the shared library through this small Java API.
    implementation project(':zipxCodecsAndroid')
    implementation 'org.tukaani:xz:1.12'
    // JVM archive fixtures use zstd-jni. Android Zstandard decoding is provided by
    // the already-bundled libarchive backend, so desktop native resources do not
    // enter the release APK.
    testImplementation 'com.github.luben:zstd-jni:1.5.7-9'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    // Apache-2.0 Hancom document libraries for scoped HWP/HWPX text extraction.
    implementation 'kr.dogfoot:hwplib:1.1.10'
    implementation 'kr.dogfoot:hwpxlib:1.0.9'
    // RAR fallback intentionally avoids Junrar/UnRAR-licensed code for FOSS compatibility.
    // RAR3/RAR4 compressed extraction is routed through libarchive-android in the default build.
    // Apache-2.0 pure-Java PDF text extraction for in-document Find (PDF reader).
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
